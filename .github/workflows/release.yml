name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate Icon Assets
        run: |
          python generate_assets.py

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconsole --onefile --windowed --icon=assets/icon.ico --add-data "assets;assets" --name Glaive src/main.py

      - name: Verify Binary
        run: |
          Get-Item dist\Glaive.exe | Select-Object Name, Length

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/Glaive.exe
          name: Glaive ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
